[build-system]
requires = ["hatchling>=1.21,<2"]
build-backend = "hatchling.build"

[project]
name = "printfarm-planner"
dynamic = ["version"]
description = "Plan production runs across a mixed Bambu Lab printer fleet with operator labour windows."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Navaneeth KG" }]
keywords = ["3d-printing", "print-farm", "scheduling", "bambu-lab", "gantt", "manufacturing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Printing",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<3",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]

[project.scripts]
printfarm-planner = "printfarm_planner.cli:main"

[project.urls]
Homepage = "https://github.com/projectbin07-stack/printfarm-planner"
Issues = "https://github.com/projectbin07-stack/printfarm-planner/issues"
Changelog = "https://github.com/projectbin07-stack/printfarm-planner/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/printfarm_planner/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/printfarm_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
mypy_path = ["src", "tests"]
explicit_package_bases = true

[tool.coverage.run]
source = ["printfarm_planner"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
