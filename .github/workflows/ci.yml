name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-fail-under=85
      - name: CLI smoke test
        run: |
          printfarm-planner --version
          printfarm-planner models
          printfarm-planner check --fleet examples/fleet.json examples/jobs.csv
          printfarm-planner plan --fleet examples/fleet.json examples/jobs.csv --start 2026-11-23T08:00 --html plan.html --csv plan.csv
          printfarm-planner plan --fleet examples/fleet.json examples/jobs.csv --start 2026-11-23T08:00 --improve anneal --iterations 200
          printfarm-planner compare --fleet examples/fleet.json examples/small-jobs.csv --start 2026-11-23T08:00 --html compare.html

  interop:
    # Live check against the pinned gcode-insight release: fresh JSON from its CLI must import as
    # the committed fixtures do (colour, printer model, Cura PRINT.TIME), the planner must plan
    # it, and it must also load when PowerShell 5.1 writes the file.
    name: interop / gcode-insight v0.3.0 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "gcode-insight @ git+https://github.com/projectbin07-stack/gcode-insight.git@v0.3.0"
      - name: Interop tests
        run: pytest -q tests/test_interop.py
      - name: Fresh JSON from the gcode-insight CLI, checked and planned
        shell: bash
        run: |
          set -e
          gcode-insight --version | tee version.txt
          grep -q "0.3.0" version.txt
          mkdir -p fresh
          for f in tests/fixtures/gcode/*.gcode; do
            gcode-insight analyze "$f" --json --out "fresh/$(basename "$f" .gcode).json"
          done
          python -c "import json,glob; assert all(json.load(open(p))['schema_version'] == 3 for p in glob.glob('fresh/*.json'))"
          printfarm-planner check --fleet examples/fleet.json fresh/bambu_cube.json | tee check.txt
          grep -q "^bambu_cube  P1S-1$" check.txt
          printfarm-planner plan --fleet examples/fleet.json --material PLA --start 2026-11-23T08:00 \
            fresh/bambu_cube.json fresh/marlin_generic.json --json > plan.json
          python -c "import json; d=json.load(open('plan.json')); jobs=sorted({a['job'] for a in d['assignments']}); print(jobs); assert jobs == ['bambu_cube', 'marlin_generic']; assert d['unscheduled'] == []"
          # The Cura file loads (PRINT.TIME as its time) but was sliced for an Ultimaker S5,
          # which is not in the example fleet: check must say so and exit 1.
          set +e
          printfarm-planner check --fleet examples/fleet.json --material PLA fresh/cura_griffin.json > cura.txt
          status=$?
          set -e
          cat cura.txt
          test "$status" -eq 1
          grep -q "sliced for ULTIMAKER S5" cura.txt
      - name: Pipeline with a PowerShell 5.1 redirect
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          gcode-insight analyze tests/fixtures/gcode/bambu_cube.gcode --json > ps_bambu.json
          $bytes = [System.IO.File]::ReadAllBytes("ps_bambu.json")
          Write-Output ("first bytes: " + (($bytes[0..1] | ForEach-Object { '{0:X2}' -f $_ }) -join ' '))
          printfarm-planner check --fleet examples/fleet.json ps_bambu.json
          if ($LASTEXITCODE -ne 0) { exit 1 }

  registry:
    # The printer and material registry is vendored from gcode-insight (the canonical copy).
    # Both files must be byte-identical to the pinned release; see gcode-insight docs/registry.md.
    name: registry matches gcode-insight v0.4.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare vendored registry files
        run: |
          base=https://raw.githubusercontent.com/projectbin07-stack/gcode-insight/v0.4.0/src/gcode_insight
          for f in registry.py print_registry.json; do
            curl -fsSL "$base/$f" -o "/tmp/$f"
            cmp "/tmp/$f" "src/printfarm_planner/$f"
            echo "$f matches gcode-insight v0.4.0"
          done
